services:
  postgres:
    image: postgres:16-alpine
    container_name: freshfold-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: freshfold
      POSTGRES_PASSWORD: freshfold
      POSTGRES_DB: freshfold
    volumes:
      - freshfold_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshfold -d freshfold"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freshfold_pg_data:
